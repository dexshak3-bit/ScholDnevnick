version: '3.8'

services:
  postgresdb:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PSW}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: ./.env
    environment:
      DB_HOST: postgresdb
      DB_PORT: 5432
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      postgresdb:
        condition: service_healthy

volumes:
  db_data: